[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bike-wind"
version = "0.2.0"
description = "Predict cycling ground speed under forecast wind from GPX routes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "requests>=2.31",
  "streamlit>=1.32",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["bike_wind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
